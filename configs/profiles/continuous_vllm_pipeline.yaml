project:
  data_dir: runtime/continuous_pipeline/data
  runtime_dir: runtime/continuous_pipeline
  reference_dir: runtime/continuous_pipeline/reference
  query_seed_catalog_path: runtime/continuous_pipeline/reference/query_seed_catalog.json
  annotation_domains_path: runtime/continuous_pipeline/reference/annotation_domains.json

sources:
  bilibili:
    max_pages_per_query: 6
    max_items_per_query: 50
    search_timeout_sec: 20
    enrich_timeout_sec: 30

crawl:
  max_queries_per_run: 60
  min_duration_sec: 15
  max_duration_sec: 1200
  max_video_size_mb: 300
  enrich_workers: 4
  max_items_per_query: 50
  retry:
    max_attempts: 5
    base_sleep_sec: 120
    max_sleep_sec: 1800
    backoff_factor: 2.0
    jitter_sec: 10
  query_shard:
    count: 3
    index: 0
  download:
    enabled: true
    workers: 4
    max_inflight_per_host: 2
    retries: 8
    fragment_retries: 8
    socket_timeout_sec: 30

preprocessing:
  max_videos_per_run: 20
  workers: 2
  prefer_subtitles: true
  fixed_window_sec: 12
  overlap_sec: 2
  subtitle_target_min_sec: 8
  subtitle_target_max_sec: 15
  min_clip_duration_sec: 4
  max_clip_duration_sec: 20
  clip_export_mode: ffmpeg
  keyframe_count: 4
  use_llm_filter: false
  duplicate_overlap_threshold: 0.8

annotation:
  max_clips_per_run: 128
  clip_workers: 8
  min_overall_confidence: 0.6
  export_requires_review_clear: false

llm:
  enabled: true
  base_url: http://127.0.0.1:8103/v1
  api_key_env: OPENAI_API_KEY
  model: qwen3.5-35b
  timeout_sec: 180
  temperature: 0.1
  max_images_per_prompt: 4
  parallel:
    enabled: true
    max_inflight_requests: 16
    acquire_timeout_sec: 300

service:
  download_loop:
    auto_prepare_reference_if_missing: true
    max_queries_per_cycle: 0
    auto_seed_if_empty: true
    auto_refill_done_queries: true
    refill_batch_size: 0
    query_recycle_cooldown_sec: 600
    max_runs_per_query: 0
    poll_interval_sec: 2
    idle_sleep_sec: 10
    max_cycles: 0
    stop_when_idle: false
    stop_when_queries_done: false

  pipeline_loop:
    auto_prepare_reference_if_missing: true
    preprocess_claim_limit: 0
    annotation_trigger_size: 0
    annotation_batch_size: 0
    annotation_trigger_timeout_sec: 30
    queue_max_clips: 0
    poll_interval_sec: 2
    idle_sleep_sec: 5
    max_cycles: 0
    stop_when_idle: false
