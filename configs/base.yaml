project:
  name: group_emotion_video
  root_dir: .
  data_dir: data
  runtime_dir: runtime
  reference_dir: data/reference
  query_seed_catalog_path: data/reference/query_seed_catalog.json
  annotation_domains_path: data/reference/annotation_domains.json
  query_seed_excel_path: ../原子情感因素.xlsx
  query_seed_sheet_name: 情感因素
  annotation_schema_source_path: ../标注字段.xlsx
  group_emotion_label_seed_path: configs/group_emotion_labels.seed.json

sources:
  default: bilibili
  bilibili:
    enabled: true
    max_pages_per_query: 2
    max_items_per_query: 5
    search_timeout_sec: 20
    enrich_timeout_sec: 30

crawl:
  max_queries_per_run: 20
  min_duration_sec: 15
  max_duration_sec: 1200
  max_video_size_mb: 300
  enrich_workers: 2
  max_items_per_query: 5
  download:
    enabled: true
    workers: 4
    max_inflight_per_host: 2
    retries: 8
    fragment_retries: 8
    socket_timeout_sec: 30

preprocessing:
  max_videos_per_run: 10
  workers: 2
  prefer_subtitles: true
  fixed_window_sec: 12
  overlap_sec: 2
  subtitle_target_min_sec: 8
  subtitle_target_max_sec: 15
  min_clip_duration_sec: 4
  max_clip_duration_sec: 20
  clip_export_mode: ffmpeg
  keyframe_count: 4
  use_llm_filter: false
  duplicate_overlap_threshold: 0.8

annotation:
  max_clips_per_run: 10
  clip_workers: 4
  min_overall_confidence: 0.6
  export_requires_review_clear: false

llm:
  enabled: false
  base_url: https://yunwu.ai/v1/
  api_key_env: YUNWU_API_KEY
  model: gemini-3.1-pro-preview
  timeout_sec: 180
  temperature: 0.1
  max_images_per_prompt: 4
  parallel:
    enabled: true
    max_inflight_requests: 2
    acquire_timeout_sec: 300

service:
  download_loop:
    max_queries_per_cycle: 20
    auto_seed_if_empty: true
    auto_refill_done_queries: true
    refill_batch_size: 20
    query_recycle_cooldown_sec: 3600
    max_runs_per_query: 0
    poll_interval_sec: 2
    idle_sleep_sec: 10
    max_cycles: 0
    stop_when_idle: false
    stop_when_queries_done: false

  pipeline_loop:
    preprocess_claim_limit: 2
    annotation_trigger_size: 16
    annotation_batch_size: 4
    annotation_trigger_timeout_sec: 30
    queue_max_clips: 128
    poll_interval_sec: 2
    idle_sleep_sec: 5
    max_cycles: 0
    stop_when_idle: false
