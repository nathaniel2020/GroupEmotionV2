[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "group-emotion-video"
version = "0.1.0"
description = "Lightweight group emotion video pipeline"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "openai>=1.0",
  "yt-dlp>=2025.0.0",
]

[project.scripts]
group-emotion-video = "group_emotion_video.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
